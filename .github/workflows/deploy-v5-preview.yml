name: Deploy paralelo-v5 preview

on:
  push:
    branches:
      - paralelo-v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v5/

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout parallel v4
        uses: actions/checkout@v4
        with:
          ref: paralelo-v4
          path: v4-source

      - name: Checkout parallel v5
        uses: actions/checkout@v4
        with:
          ref: paralelo-v5
          path: v5-source

      - name: Run v5 characterization tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parallel v5
        working-directory: v5-source
        run: npm test

      - name: Prepare isolated preview paths
        run: |
          mkdir -p site/v4 site/v5
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='tmp/' \
            v4-source/ site/v4/
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='tmp/' \
            v5-source/ site/v5/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site and previews
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
